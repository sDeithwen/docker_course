# ============================================
# DOCKER COMPOSE ШПАРГАЛКА
# ============================================

services:
  # ------------------------------------------
  # ОСНОВНЫЕ ПАРАМЕТРЫ СЕРВИСА
  # ------------------------------------------
  service_name:
    # Образ: image: ИМЯ_ОБРАЗА:ТЕГ
    image: ИМЯ_ОБРАЗА:ТЕГ

    # Имя контейнера
    container_name: ИМЯ_КОНТЕЙНЕРА

    # Проброс портов: "ХОСТ:КОНТЕЙНЕР"
    ports:
      - "ХОСТ_ПОРТ:КОНТЕЙНЕР_ПОРТ"

    # Переменные окружения
    environment:
      - ПЕРЕМЕННАЯ=${ПЕРЕМЕННАЯ_ИЗ_ENV}
      # Альтернативный формат словаря:
      # ПЕРЕМЕННАЯ: ${ПЕРЕМЕННАЯ_ИЗ_ENV}

  # ------------------------------------------
  # ТИПЫ ТОМОВ (volumes)
  # ------------------------------------------
  service_name:
    # 1. BIND MOUNT (привязка к файловой системе хоста)
    #    Путь начинается с . (относительный) или / (абсолютный)
    volumes:
      - ./ПУТЬ_НА_ХОСТЕ:ПУТЬ_В_КОНТЕЙНЕРЕ          # относительный путь
      - /АБСОЛЮТНЫЙ_ПУТЬ_НА_ХОСТЕ:ПУТЬ_В_КОНТЕЙНЕРЕ  # абсолютный путь

    # 2. ИМЕНОВАННЫЙ ТОМ (управляется Docker)
    #    Путь НЕ содержит . или / в начале
    volumes:
      - ИМЯ_ТОМА:ПУТЬ_В_КОНТЕЙНЕРЕ

  # ------------------------------------------
  # СЕТИ (networks)
  # ------------------------------------------
  service_name:
    # Подключение к сетям
    networks:
      - ИМЯ_СЕТИ

  # ------------------------------------------
  # ЗАВИСИМОСТИ (depends_on)
  # ------------------------------------------
  service_name:
    # Простая зависимость (ждет только запуска контейнера)
    depends_on:
      - ИМЯ_СЕРВИСА

    # Условная зависимость (ждет, пока сервис станет healthy)
    depends_on:
      ИМЯ_СЕРВИСА:
        condition: service_healthy

  # ------------------------------------------
  # ПРОВЕРКА ЗДОРОВЬЯ (healthcheck)
  # ------------------------------------------
  service_name:
    healthcheck:
      test: ["CMD", "КОМАНДА", "АРГУМЕНТ"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 15s

# ============================================
# ОПРЕДЕЛЕНИЕ СЕТЕЙ
# ============================================
networks:
  # По умолчанию итоговое имя сети = [ПРОЕКТ]_[ИМЯ_СЕТИ]
  # Чтобы задать явное имя, используйте параметр name:
  ИМЯ_СЕТИ:
    driver: bridge
    name: ЯВНОЕ_ИМЯ_СЕТИ     # задает имя без префикса проекта
    # internal: true          # изолированная сеть без доступа наружу
    # external: true          # использовать существующую сеть

# ============================================
# ОПРЕДЕЛЕНИЕ ИМЕНОВАННЫХ ТОМОВ
# ============================================
volumes:
  # Именованные тома, используемые в services
  ИМЯ_ТОМА:
    name: ЯВНОЕ_ИМЯ_ТОМА      # задает имя без префикса проекта
    # external: true          # использовать существующий том
    # driver: local           # драйвер тома (по умолчанию local)